<!DOCTYPE html>
<html>

<head>
    <title>Website Gaya Lama</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        td {
            border: 1px solid #999;
            padding: 10px;
        }
        
        .header {
            background-color: #ccc;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        
        .sidebar {
            background-color: #eee;
            width: 200px;
        }
        
        .content {
            background-color: #fff;
        }
        
        .footer {
            background-color: #ccc;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <table>
        <!-- Baris Header -->
        <tr>
            <td colspan="2" class="header">
                SELAMAT DATANG DI WEBSITE LAMA
            </td>
        </tr>

        <!-- Baris Konten dan Sidebar -->
        <tr>
            <td class="sidebar">
                <b>Menu:</b><br/> - Beranda<br/> - Profil<br/> - Kontak<br/>
            </td>
            <td class="content">
                <h2>Ini adalah konten utama</h2>
                <p>Website ini menggunakan tabel untuk layout.</p>
            </td>
        </tr>

        <!-- Baris Footer -->
        <tr>
            <td colspan="2" class="footer">
                &copy; 2025 Website Kuno. Semua hak dilestarikan.
            </td>
        </tr>
    </table>

</body>

</html>
