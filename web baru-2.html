<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Modern Tanpa Tabel</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        
        .header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .container {
            display: flex;
        }
        
        .sidebar {
            width: 200px;
            background-color: #ddd;
            padding: 15px;
        }
        
        .content {
            flex: 1;
            background-color: white;
            padding: 20px;
        }
        
        .footer {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 10px;
        }
        
        .menu-item {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Selamat Datang di Website Modern</h1>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="menu-item">🏠 Beranda</div>
            <div class="menu-item">👤 Profil</div>
            <div class="menu-item">📞 Kontak</div>
        </div>

        <div class="content">
            <h2>Konten Utama</h2>
            <p>Ini adalah contoh website tanpa tabel, menggunakan <code>&lt;div&gt;</code> dan CSS Flexbox untuk layout.</p>
